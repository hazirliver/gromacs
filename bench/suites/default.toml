# ----------------------------------------------------------------------------------------------
# Performance suite (end-to-end A/B + per-stage + GPU kernels)
#   Run length is calibrated per case/config so the timed window lasts ~target_seconds.
# ----------------------------------------------------------------------------------------------
[perf]
repeats = { smoke = 2, quick = 5, full = 9 }
warmup = 1
target_seconds = { smoke = 3, quick = 8, full = 20 }
calib_steps = 2000
reset_fraction = 0.25
timeout = 1800
tunepme = false          # PME tuning is timing-driven (non-deterministic work); off for A/B
alpha = 0.05
min_effect = 0.01        # significant effects below 1 % are reported as "negligible"
stage_min_pct = 1.0      # stages/kernels below this share of the time are not compared
nsys = { smoke = true, quick = true, full = true }
nsys_repeats = { smoke = 1, quick = 2, full = 3 }
nsys_steps = { smoke = 1000, quick = 3000, full = 5000 }

[[perf.cases]]
name = "water-5k/pme"
system = "water-5k"
mdp = ["common", "@system", "water-pme", "perf-out"]
configs = ["perf-gpu-resident", "perf-gpu-resident-graphs", "perf-cpu"]
tiers = ["smoke", "quick", "full"]

[[perf.cases]]
name = "water-41k/pme"
system = "water-41k"
mdp = ["common", "@system", "water-pme", "perf-out"]
configs = ["perf-gpu-resident", "perf-gpu-nbpme", "perf-cpu"]

[[perf.cases]]
name = "water-41k/rf"
system = "water-41k"
mdp = ["common", "@system", "water-pme", "water-rf", "perf-out"]
configs = ["perf-gpu-resident", "perf-cpu"]
tiers = ["full"]

[[perf.cases]]
name = "water-332k/pme"
system = "water-332k"
mdp = ["common", "@system", "water-pme", "perf-out"]
configs = ["perf-gpu-resident", "perf-gpu-nbpme"]
calib_steps = 1000

[[perf.cases]]
name = "water-1m/pme"
system = "water-1m"
mdp = ["common", "@system", "water-pme", "perf-out"]
configs = ["perf-gpu-resident"]
calib_steps = 500
tiers = ["full"]

[[perf.cases]]
name = "water-fep-41k/softcore"
system = "water-fep-41k"
mdp = ["common", "@system", "water-pme", "fep", "perf-out"]
configs = ["perf-gpu-resident", "perf-cpu"]
calib_steps = 1000

[[perf.cases]]
name = "tip4p-35k/pme"
system = "tip4p-35k"
mdp = ["common", "@system", "water-pme", "perf-out"]
configs = ["perf-gpu-nbpme", "perf-cpu"]
tiers = ["full"]

[[perf.cases]]
name = "lysozyme/pme"
system = "lysozyme"
mdp = ["common", "protein", "perf-out"]
configs = ["perf-gpu-resident", "perf-gpu-nbpme", "perf-gpu-nb", "perf-cpu"]
tiers = ["smoke", "quick", "full"]

[[perf.cases]]
name = "lysozyme/hmr-4fs"
system = "lysozyme"
mdp = ["common", "protein", "hmr", "perf-out"]
configs = ["perf-gpu-resident"]
tiers = ["full"]

[[perf.cases]]
name = "lysozyme-vsite/4fs"
system = "lysozyme-vsite"
mdp = ["common", "protein", "dt4fs", "perf-out"]
configs = ["perf-gpu-nbpme", "perf-gpu-resident"]
tiers = ["full"]

# ----------------------------------------------------------------------------------------------
# Isolated kernel micro-benchmarks (gmx nonbonded-benchmark: 36 flavours x {F, VF} per entry)
# size = power-of-2 factor; the system has 3000 x size atoms
# ----------------------------------------------------------------------------------------------
[micro]
repeats = { smoke = 2, quick = 5, full = 9 }
alpha = 0.05
min_effect = 0.01

[[micro.nbnxm]]
name = "nbnxm-3k-1t"
size = 1
threads = 1
iter = { smoke = 50, quick = 200, full = 500 }
tiers = ["smoke", "quick", "full"]

[[micro.nbnxm]]
name = "nbnxm-24k-1t"
size = 8
threads = 1
iter = { quick = 30, full = 100 }

[[micro.nbnxm]]
name = "nbnxm-24k-20t"
size = 8
threads = 20
iter = { quick = 200, full = 500 }

[[micro.nbnxm]]
name = "nbnxm-192k-20t"
size = 64
threads = 20
iter = { full = 50 }
tiers = ["full"]

[[micro.nbnxm]]
name = "nbnxm-24k-20t-rc1.2"
size = 8
threads = 20
cutoff = 1.2
iter = { full = 200 }
tiers = ["full"]

# ----------------------------------------------------------------------------------------------
# Run-argument sweep (gmxbench sweep): which mdrun arguments are best for each use case
# ----------------------------------------------------------------------------------------------
[sweep]
repeats = { smoke = 1, quick = 2, full = 3 }
target_seconds = { smoke = 3, quick = 6, full = 15 }
calib_steps = 1000
timeout = 1800
min_gain = 0.01          # a later stage must beat the incumbent by 1 % to add its arguments

[sweep.dims]
cpu_layouts = ["1x20", "1x40", "2x10", "4x5", "5x4", "4x10", "10x2"]   # ranks x OpenMP threads
gpu_offload = ["gpu-nb", "gpu-nb-pme", "gpu-resident", "gpu-resident-bondedcpu"]
gpu_threads = [4, 8, 16]
nstlist = [50, 80, 150, 200, 300]
concurrency = [2, 4]
tunepme = true

[[sweep.systems]]
name = "water-5k"
system = "water-5k"
mdp = ["common", "@system", "water-pme", "perf-out"]
tiers = ["smoke", "quick", "full"]

[[sweep.systems]]
name = "water-41k"
system = "water-41k"
mdp = ["common", "@system", "water-pme", "perf-out"]

[[sweep.systems]]
name = "water-332k"
system = "water-332k"
mdp = ["common", "@system", "water-pme", "perf-out"]
tiers = ["full"]

[[sweep.systems]]
name = "water-fep-41k"
system = "water-fep-41k"
mdp = ["common", "@system", "water-pme", "fep", "perf-out"]
tiers = ["full"]

[[sweep.systems]]
name = "lysozyme"
system = "lysozyme"
mdp = ["common", "protein", "perf-out"]
