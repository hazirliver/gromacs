# THROWAWAY EXPERIMENT (code change in /home/asokolov/Projects/gromacs-exp-nbminblocks, not in src/):
# (1) NB kernel __launch_bounds__ minimum blocks per SM 16 (upstream, build P) vs 20 / 24 (sm_89).
# (2) stream priorities swapped: NB local High, PME Normal (upstream: PME High, NB local Normal).
# (3) host code compiled by nvcc gets -fopenmp (OpenMP pragmas in *_gpu.cpp take effect).
# (4) GPU bonded kernel in its own stream (overlaps the NB kernel instead of preceding it).
# Numbers are kept separate from the main comparison (quality suite not run on these builds).
repeats = 5

[builds]
P = "~/.cache/gmxbench/builds/3bf7713a0dd56c41"
MB20 = "~/.cache/gmxbench/builds/16975953e72a9b65"
MB24 = "~/.cache/gmxbench/builds/f5b973e5f3b87e02"
PRIOSWAP = "~/.cache/gmxbench/builds/cbb50c98ae37ae0d"
OMPCUDA = "~/.cache/gmxbench/builds/3136061f41d389dc"
BSTREAM = "~/.cache/gmxbench/builds/44e346d549ee6c7d"

[tprs]
prod = "bench/results/profiling-2026-10-06/raw/inputs/prod/topol.tpr"

[defaults]
tpr = "prod"
args = "-ntmpi 1 -ntomp 16 -nb gpu -pme gpu -bonded gpu -update gpu -nstlist 200"
nsteps = 25000
resetstep = 5000

[[variant]]
name = "mb16-P"
build = "P"
[[variant]]
name = "mb20"
build = "MB20"
[[variant]]
name = "mb24"
build = "MB24"
[[variant]]
name = "prioswap"
build = "PRIOSWAP"
[[variant]]
name = "ompcuda"
build = "OMPCUDA"
[[variant]]
name = "bondedstream"
build = "BSTREAM"
