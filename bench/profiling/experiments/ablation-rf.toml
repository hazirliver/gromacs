# Reaction-field ablation (TIMING ONLY): bounds everything PME (mesh kernels + Ewald real-space cost in
# the NB kernel). PME is not used, so -pme gpu must not be given.
repeats = 5

[builds]
P = "~/.cache/gmxbench/builds/3bf7713a0dd56c41"

[tprs]
prod = "bench/results/profiling-2026-10-06/raw/inputs/prod/topol.tpr"
rf = "bench/results/profiling-2026-10-06/raw/inputs/rf/topol.tpr"

[defaults]
build = "P"
nsteps = 25000
resetstep = 5000

[[variant]]
name = "prod"
tpr = "prod"
args = "-ntmpi 1 -ntomp 16 -nb gpu -pme gpu -bonded gpu -update gpu -nstlist 200"
[[variant]]
name = "rf"
tpr = "rf"
args = "-ntmpi 1 -ntomp 16 -nb gpu -bonded gpu -update gpu -nstlist 200"
